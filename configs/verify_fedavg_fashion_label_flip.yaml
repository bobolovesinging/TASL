algorithms: [fedavg]
byzantine:
  attacks: [label_flip]
  ratio: 0.4
data:
  alpha: 0.3
  batch_size: 64
  dataset: fashionmnist
  n_clients: 10
  split: non_iid
experiment:
  device: cuda
  name: verify_fedavg_fashion_label_flip
  output_dir: results
  seed: 42
model:
  name: fedavgcnn
  num_classes: 10
training:
  local_epochs: 1
  lr: 0.01
  momentum: 0.9
  rounds: 50
  weight_decay: 0.0001
