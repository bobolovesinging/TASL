# ============================================================
# 实验二: MNIST — 只跑新增攻击 (min_max + scaling)
# 已有: label_flip, sign_flip, gaussian_noise
# ============================================================

experiment:
  name: "exp2_mnist_new_attacks"
  seed: 42
  device: "cpu"
  output_dir: "results"

data:
  dataset: "mnist"
  data_dir: null
  n_clients: 10
  alpha: 0.3
  split: "non_iid"
  batch_size: 128

model:
  name: "fedavgcnn"
  num_classes: 10

training:
  rounds: 25
  local_epochs: 2
  lr: 0.02
  momentum: 0.9
  weight_decay: 1e-4

byzantine:
  ratio: 0.4
  attacks:
    - min_max
    - scaling

algorithms:
  - fedavg
  - multi_krum
  - trimmed_mean
  - fltrust
  - tasl

algorithm_params:
  tasl:
    trust_power: 5
    weight_cap_ratio: 1.5
    ema_alpha: 0.7
    norm_penalty: 0.8
    min_cos: 0.2
  multi_krum:
    krum_m: null
  min_max:
    z_max: 2.0
  scaling:
    scaling_factor: 100.0
