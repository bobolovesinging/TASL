algorithm_params:
  krum: {num_excluded: 3}
  multi_krum: {num_excluded: 3}
  scaling: {scaling_factor: 5.0}
algorithms: [fedavg, multi_krum, trimmed_mean, fltrust, tasl]
byzantine: {attacks: [scaling], ratio: 0.3}
data: {alpha: 0.3, batch_size: 64, dataset: cifar10, n_clients: 10, split: non_iid}
experiment: {device: cuda, name: exp_byz_cifar10_r30_scaling, output_dir: results, seed: 42}
model: {name: resnet18_cifar, num_classes: 10}
training: {local_epochs: 1, lr: 0.01, momentum: 0.9, rounds: 100, weight_decay: 0.0001}
