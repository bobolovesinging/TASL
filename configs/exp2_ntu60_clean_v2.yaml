# ============================================================
# Clean Baseline V2 — NTU-60 + ST-GCN (FedPure-style config)
# ============================================================

experiment:
  name: "exp2_ntu60_clean_v2"
  seed: 42
  device: "cuda"
  output_dir: "results"

# ── 数据 ──
data:
  dataset: "ntu60"
  data_dir: "/media/njit5/39e16d05-05ba-46b4-bc9b-47b3c98f1d4f/tlf/datasets/dir0.1"
  n_clients: 10
  alpha: 0.1
  split: "non_iid"
  batch_size: 64

# ── 模型 ──
model:
  name: "stgcn"
  num_classes: 60
  in_channels: 3
  graph_layout: "ntu-rgb+d"
  graph_strategy: "spatial"
  edge_importance_weighting: true
  dropout: 0.5

# ── 训练 (FedPure-style) ──
training:
  rounds: 300
  local_epochs: 1
  lr: 0.1
  momentum: 0.9
  weight_decay: 0.0004
  nesterov: true
  lr_schedule:
    warm_up_epoch: 5
    step: [20, 40, 60, 80, 100, 120, 140, 160, 180, 200, 220, 240, 260, 280]
    lr_decay_rate: 0.1

# ── Byzantine (no attack) ──
byzantine:
  ratio: 0.0
  attacks:
    - none

# ── 算法 ──
algorithms:
  - fedavg
  - fedprox

algorithm_params:
  fedprox:
    mu: 0.01
