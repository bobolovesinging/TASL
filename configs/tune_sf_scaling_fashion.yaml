algorithm_params:
  scaling: {scaling_factor: 5.0}
  tasl:
    trust_power: 5.0
    weight_cap_ratio: 1.5
    ema_alpha: 0.7
    norm_penalty: 0.8
    tau_high: 0.6
    norm_gate_factor: 2.5
algorithms: [tasl]
byzantine: {attacks: [sign_flip, scaling], ratio: 0.4}
data: {alpha: 0.3, batch_size: 64, dataset: fashionmnist, n_clients: 10, split: non_iid}
experiment: {device: cuda, name: tune_sf_scaling_fashion, output_dir: results, seed: 42}
model: {name: fedavgcnn, num_classes: 10}
training: {local_epochs: 1, lr: 0.01, momentum: 0.9, rounds: 50, weight_decay: 0.0001}
